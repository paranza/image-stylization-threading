<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Threading: string art from any picture</title>
    <meta name="description" content="Turn a picture into string art. One or three threads wound between pegs rebuild the image, the way hatching builds tone from lines." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111'/%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%23fff' stroke-width='1.5'/%3E%3Cpath d='M5 12L27 20M7 25L25 7M11 5L21 27' stroke='%23fff' stroke-width='1.2'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="app">
      <aside class="panel" id="panel">
        <header class="brand">
          <div class="mark" aria-hidden="true"></div>
          <div>
            <h1>Threading</h1>
            <p class="tagline">String art from any picture</p>
          </div>
        </header>

        <section class="block">
          <div class="row">
            <label class="button primary" data-note="Any picture works. Strong value contrast and a simple silhouette read best in thread, as in a good charcoal drawing.">
              <input type="file" id="file" accept="image/*" hidden />Upload image
            </label>
            <button type="button" id="sample" class="button" data-note="Vermeer's Girl with a Pearl Earring (about 1665): a lit face against a near black ground, a textbook case of chiaroscuro.">Sample</button>
          </div>
          <p class="hint">or drop an image on the canvas</p>
        </section>

        <section class="block">
          <h2>Frame</h2>
          <div class="field" data-note="The frame is the loom. A circle (ellipse) is the classic string art loom; a rectangle fits the picture edge to edge.">
            <span class="label">Shape</span>
            <div class="seg" role="radiogroup" aria-label="Shape">
              <label><input type="radio" name="shape" value="rectangle" />Rectangle</label>
              <label><input type="radio" name="shape" value="ellipse" checked />Ellipse</label>
            </div>
          </div>
          <div class="field" data-note="Pegs set the finest detail the thread can describe, like the grain of the paper or the size of the brush.">
            <label class="label" for="pegs">Pegs <output for="pegs"></output></label>
            <input type="range" id="pegs" min="40" max="1000" step="10" value="300" />
          </div>
        </section>

        <section class="block">
          <h2>Thread</h2>
          <div class="field" data-note="Three colors uses optical mixing: thin colored lines blend in the eye, as in Seurat's pointillism or a printed halftone.">
            <span class="label">Mode</span>
            <div class="seg" role="radiogroup" aria-label="Mode">
              <label><input type="radio" name="mode" value="mono" checked />Mono</label>
              <label><input type="radio" name="mode" value="color" />Three colors</label>
            </div>
          </div>
          <div class="field" data-note="Quality is the size of the working sketch. Higher is finer but slower to compute.">
            <span class="label">Quality</span>
            <div class="seg" role="radiogroup" aria-label="Quality">
              <label><input type="radio" name="quality" value="low" />Low</label>
              <label><input type="radio" name="quality" value="medium" checked />Medium</label>
              <label><input type="radio" name="quality" value="high" />High</label>
            </div>
          </div>
          <div class="field" data-note="Segments are hatching passes. Each pass darkens a little; tone appears where passes stack up.">
            <label class="label" for="segments">Segments <output for="segments"></output></label>
            <input type="range" id="segments" min="100" max="20000" step="100" value="3000" />
          </div>
          <div class="field" data-note="Opacity is pencil pressure: how much tone one pass lays down. Light pressure needs more passes but gives softer gradations.">
            <label class="label" for="opacity">Opacity <output for="opacity"></output></label>
            <input type="range" id="opacity" min="0.02" max="0.6" step="0.01" value="0.15" />
          </div>
          <div class="field" data-note="Thickness is the nib size. It only changes the drawing, not the path the thread takes.">
            <label class="label" for="thickness">Thickness <output for="thickness"></output></label>
            <input type="range" id="thickness" min="0.25" max="3" step="0.05" value="1" />
          </div>
          <div class="field" data-note="Dark ground: light thread on black, drawing with light instead of shadow, like white chalk on toned paper. Colors switch from subtractive (cyan, magenta, yellow) to additive (red, green, blue).">
            <label class="switch"><input type="checkbox" id="dark" /><span></span>Dark ground</label>
          </div>
        </section>

        <details class="block">
          <summary><h2>Tone</h2></summary>
          <div class="field" data-note="Value key: a high key picture lives in the light values (think Monet in fog), a low key one in the dark values (think Rembrandt).">
            <span class="label">Value key</span>
            <div class="seg" role="radiogroup" aria-label="Value key">
              <label><input type="radio" name="key" value="high" />High</label>
              <label><input type="radio" name="key" value="normal" checked />Normal</label>
              <label><input type="radio" name="key" value="low" />Low</label>
            </div>
          </div>
          <div class="field" data-note="Chiaroscuro: push lights lighter and darks darker for drama, the way Caravaggio sets a figure against a dark ground.">
            <label class="label" for="contrast">Chiaroscuro <output for="contrast"></output></label>
            <input type="range" id="contrast" min="0" max="1" step="0.05" value="0" />
          </div>
          <div class="field" data-note="Value steps group tones into a few flat values, like a value study made before a painting. Smooth keeps every tone.">
            <label class="label" for="steps">Value steps</label>
            <select id="steps">
              <option value="0" selected>Smooth</option>
              <option value="3">3: light, mid, dark</option>
              <option value="5">5</option>
              <option value="7">7</option>
              <option value="9">9: Ross value scale</option>
            </select>
          </div>
        </details>

        <details class="block">
          <summary><h2>Display</h2></summary>
          <div class="field" data-note="Show where the pegs sit on the frame.">
            <label class="switch"><input type="checkbox" id="showPegs" /><span></span>Show pegs</label>
          </div>
          <div class="field" data-note="Circles mark the peg each thread is on right now.">
            <label class="switch"><input type="checkbox" id="showIndicators" /><span></span>Show thread position</label>
          </div>
          <div class="field" data-note="Blur is squinting: artists squint to drop the detail and judge the big value masses.">
            <label class="label" for="blur">Squint <output for="blur"></output></label>
            <input type="range" id="blur" min="0" max="10" step="0.5" value="0" />
          </div>
        </details>

        <section class="note" aria-live="polite">
          <p id="note">Hover a control to see the drawing idea behind it.</p>
          <a href="./about.html">The art behind the threads &rarr;</a>
        </section>
      </aside>

      <main class="stage">
        <div class="toolbar">
          <div class="seg views" role="radiogroup" aria-label="View" data-note="Compare the thread drawing with its value study and the source, the way a painter steps back from the easel.">
            <label><input type="radio" name="view" value="art" checked />Thread</label>
            <label><input type="radio" name="view" value="study" />Value study</label>
            <label><input type="radio" name="view" value="original" />Source</label>
          </div>
          <div class="actions">
            <button type="button" id="downloadSvg" class="button" title="Every segment as a vector line, for a plotter or a laser cutter">SVG</button>
            <button type="button" id="downloadText" class="button" title="The peg sequence of each thread, to wind the piece by hand">Winding guide</button>
          </div>
        </div>
        <div class="progress" aria-hidden="true"><div id="progress"></div></div>

        <div class="canvasWrap">
          <div class="frame" id="drop">
            <canvas id="art" aria-label="String art drawing"></canvas>
            <canvas id="reference" aria-label="Reference view" hidden></canvas>
            <canvas id="overlay" aria-hidden="true"></canvas>
            <div class="dropHint">Drop image</div>
          </div>
        </div>

        <footer class="under">
          <div class="scale" id="valueScale" title="Share of the picture in each step of a 9 step value scale, darkest on the left"></div>
          <dl class="stats">
            <div><dt>Pegs</dt><dd id="statPegs">-</dd></div>
            <div><dt>Segments</dt><dd id="statSegments">-</dd></div>
            <div><dt>Error avg</dt><dd id="statAvg">-</dd></div>
            <div><dt>Error mean sq.</dt><dd id="statMse">-</dd></div>
            <div><dt>Error variance</dt><dd id="statVar">-</dd></div>
            <div><dt>Speed</dt><dd id="statSpeed">-</dd></div>
          </dl>
        </footer>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
